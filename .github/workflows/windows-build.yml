name: Windows Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Test clean installer Gradle bootstrap
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'aokuvue-gradle-bootstrap'
          "AOKUVUE_GRADLE_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:AOKUVUE_GRADLE_CACHE = $cache
          Remove-Item -LiteralPath $cache -Recurse -Force -ErrorAction SilentlyContinue
          .\gradlew.bat --version --no-daemon
          if ($LASTEXITCODE -ne 0) { throw "Gradle bootstrap failed with exit code $LASTEXITCODE" }

      - name: Build and test
        shell: pwsh
        run: .\gradlew.bat clean test installDist --no-daemon --stacktrace

      - name: Package portable Windows app
        shell: pwsh
        run: |
          $version = (.\gradlew.bat -q printVersion --no-daemon | Select-Object -Last 1).Trim()
          if (-not $version) { throw 'Could not determine AOKUVUE version.' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (Test-Path dist\Aokuvue) { Remove-Item dist\Aokuvue -Recurse -Force }
          & jpackage `
            --type app-image `
            --name Aokuvue `
            --app-version $version `
            --vendor 'AOKUVUE' `
            --description 'AOKUVUE anime and manga desktop application' `
            --input 'build\install\Aokuvue\lib' `
            --main-jar "Aokuvue-$version.jar" `
            --main-class app.kspani.MainLauncher `
            --java-options '-Dfile.encoding=UTF-8' `
            --java-options '-Dprism.order=d3d,sw' `
            --icon 'src\main\resources\images\aokuvue.ico' `
            --dest dist
          if ($LASTEXITCODE -ne 0) { throw "jpackage failed with exit code $LASTEXITCODE" }
          Compress-Archive -Path 'dist\Aokuvue\*' -DestinationPath "dist\Aokuvue-$version-windows-portable.zip" -Force
          "AOKUVUE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Aokuvue-${{ env.AOKUVUE_VERSION }}-windows-portable
          path: dist/Aokuvue-*-windows-portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7
