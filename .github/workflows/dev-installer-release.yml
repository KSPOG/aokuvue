name: Aokuvue Dev Installer

on:
  push:
    branches: [ dev ]
    paths:
      - 'installer/**'
      - '.github/workflows/dev-installer-release.yml'
      - 'src/main/resources/images/aokuvue-icon.png'
      - 'src/main/resources/images/aokuvue-moonlight.png'
      - 'src/main/resources/images/aokuvue.ico'
  pull_request:
    branches: [ dev ]
    paths:
      - 'installer/**'
      - '.github/workflows/dev-installer-release.yml'
      - 'src/main/resources/images/aokuvue-icon.png'
      - 'src/main/resources/images/aokuvue-moonlight.png'
      - 'src/main/resources/images/aokuvue.ico'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dev-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DEV_INSTALLER_VERSION: '0.1.3'
      RELEASE_TAG: 'dev-installer-v0.1.3'

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Self-test dev installer
        shell: pwsh
        run: |
          python installer\aokuvue_dev_installer.py --self-test
          $trackedCache = @(git ls-files -- '.gradle-user-home/**')
          if ($trackedCache.Count -gt 0) {
            throw ".gradle-user-home contains $($trackedCache.Count) tracked generated files. These make the Windows source archive unsafe to extract."
          }

      - name: Build single-file dev installer
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name AokuvueDevInstaller `
            --paths installer `
            --icon src\main\resources\images\aokuvue.ico `
            --add-data "src\main\resources\images\aokuvue-icon.png;assets" `
            --add-data "src\main\resources\images\aokuvue-moonlight.png;assets" `
            --add-data "src\main\resources\images\aokuvue.ico;assets" `
            installer\aokuvue_dev_installer.py
          if (!(Test-Path 'dist\AokuvueDevInstaller.exe')) {
            throw 'AokuvueDevInstaller.exe was not produced.'
          }
          $hash = (Get-FileHash -Algorithm SHA256 'dist\AokuvueDevInstaller.exe').Hash.ToLowerInvariant()
          "$hash  AokuvueDevInstaller.exe" | Out-File -Encoding ascii 'dist\AokuvueDevInstaller.exe.sha256'

      - name: Upload dev installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AokuvueDevInstaller-${{ env.DEV_INSTALLER_VERSION }}
          path: |
            dist/AokuvueDevInstaller.exe
            dist/AokuvueDevInstaller.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish dev installer prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          # Aokuvue Dev Installer v$env:DEV_INSTALLER_VERSION

          This installer follows the repository's `dev` branch and installs **Aokuvue Dev**
          beside the stable Aokuvue application. It uses separate install, state and cache
          directories and does not replace the stable application.

          Each run resolves and builds the latest `dev` commit, verifies Eclipse Temurin JDK 21,
          runs the application tests, and atomically installs the resulting Windows app image.

          This development installer is unsigned and installs prerelease software.
          "@

          gh release view $env:RELEASE_TAG --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG `
              'dist\AokuvueDevInstaller.exe' `
              'dist\AokuvueDevInstaller.exe.sha256' `
              --repo '${{ github.repository }}' --clobber
            gh release edit $env:RELEASE_TAG --repo '${{ github.repository }}' `
              --target '${{ github.sha }}' `
              --title "Aokuvue Dev Installer v$env:DEV_INSTALLER_VERSION" `
              --notes $notes --prerelease
          } else {
            gh release create $env:RELEASE_TAG `
              'dist\AokuvueDevInstaller.exe' `
              'dist\AokuvueDevInstaller.exe.sha256' `
              --repo '${{ github.repository }}' `
              --target '${{ github.sha }}' `
              --title "Aokuvue Dev Installer v$env:DEV_INSTALLER_VERSION" `
              --notes $notes --prerelease
          }
