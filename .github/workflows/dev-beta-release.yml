name: Dev Beta Release

on:
  push:
    branches: [ dev ]
    paths:
      - 'src/main/java/app/kspani/app/AppVersion.java'
      - 'src/main/java/app/kspani/ui/SettingsUiEnhancer.java'
      - '.github/workflows/dev-beta-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-beta:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BETA_VERSION: '0.0.3'
      RELEASE_TAG: 'beta-0.0.3'

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build and test beta
        shell: pwsh
        run: .\gradlew.bat clean test installDist --no-daemon --stacktrace

      - name: Package Beta 0.0.3
        shell: pwsh
        run: |
          $runtimeVersion = (.\gradlew.bat -q printVersion --no-daemon | Select-Object -Last 1).Trim()
          if (-not $runtimeVersion) { throw 'Could not determine the internal Aokuvue runtime version.' }

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (Test-Path 'dist\Aokuvue') { Remove-Item 'dist\Aokuvue' -Recurse -Force }

          & jpackage `
            --type app-image `
            --name Aokuvue `
            --app-version $env:BETA_VERSION `
            --vendor 'Aokuvue' `
            --description 'Aokuvue Beta desktop application' `
            --input 'build\install\Aokuvue\lib' `
            --main-jar "Aokuvue-$runtimeVersion.jar" `
            --main-class app.kspani.MainLauncher `
            --java-options '-Dfile.encoding=UTF-8' `
            --java-options '-Dprism.order=d3d,sw' `
            --icon 'src\main\resources\images\aokuvue.ico' `
            --dest dist
          if ($LASTEXITCODE -ne 0) { throw "jpackage failed with exit code $LASTEXITCODE" }

          $asset = "dist\Aokuvue-Beta-$env:BETA_VERSION-windows-portable.zip"
          Compress-Archive -Path 'dist\Aokuvue\*' -DestinationPath $asset -Force
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
          "$hash  Aokuvue-Beta-$env:BETA_VERSION-windows-portable.zip" | Out-File -Encoding ascii "$asset.sha256"

      - name: Publish dev prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = "dist\Aokuvue-Beta-$env:BETA_VERSION-windows-portable.zip"
          $checksum = "$asset.sha256"
          $notes = @"
          # Aokuvue Beta - $env:BETA_VERSION

          Pre-release build from the `dev` branch for testing before promotion to `main`.

          ## Included in this beta
          - AniList AiringSchedule-backed Calendar with year and month selection.
          - Upcoming episode/release times rendered in the user's local system timezone.
          - Dedicated Genres page populated from AniList GenreCollection.
          - Genre category cards instead of redirecting Genres to Explore.
          - Genres dropdown removed from Explore.
          - Paginated AniList catalogs for Explore, Manga, Hentai, Movies, Originals and Curated.
          - Automatic additional-page loading near the end of the catalog plus a manual Load more fallback.
          - Settings > Appearance now identifies this channel as **Beta - $env:BETA_VERSION**.

          This is a development prerelease and is not the public stable `main` release.
          "@

          gh release view $env:RELEASE_TAG --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $asset $checksum --repo '${{ github.repository }}' --clobber
            gh release edit $env:RELEASE_TAG --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "Aokuvue Beta - $env:BETA_VERSION" --notes $notes --prerelease
          } else {
            gh release create $env:RELEASE_TAG $asset $checksum --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "Aokuvue Beta - $env:BETA_VERSION" --notes $notes --prerelease
          }
